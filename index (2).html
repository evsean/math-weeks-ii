<script>
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[rand(0,a.length-1)];
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const simp=(n,d)=>{const g=gcd(n,d)||1;n/=g;d/=g;if(d<0){n=-n;d=-d}return d===1?String(n):n+"/"+d}

function trio(answer, wrongs){
  const set=new Set([String(answer)]);
  (wrongs||[]).forEach(w=>{if(w!==undefined&&w!==null&&String(w)!==String(answer))set.add(String(w))});
  let k=1;
  while(set.size<3 && k<40){
    const n=Number(answer);
    set.add(Number.isFinite(n)?String(n+pick([-8,-5,-4,-3,-2,-1,1,2,3,4,5,8])):String(answer)+" ");
    k++;
  }
  if(set.size<3) set.add("None of these");
  const choices=shuffle([...set]).slice(0,3);
  if(!choices.includes(String(answer))) choices[0]=String(answer);
  const c=shuffle(choices);
  return {choices:c, answer:c.indexOf(String(answer))};
}

const WEEKS=[];
Object.keys(RAW).map(Number).sort((a,b)=>a-b).forEach(age=>{
  const {grade, units}=RAW[age];
  let n=0;
  units.forEach((unit,ui)=>{
    unit[1].forEach(row=>{
      n++;
      WEEKS.push({id:age+"-"+n, age, grade, week:n, unit:unit[0], quarter:Math.ceil(n/13), title:row[0], type:row[1], concept:row[2]});
    });
  });
});

function ageNum(age, lo, hi){ return rand(lo,hi) }

function makeProblem(type, age){
  const G={
    place(){const n=age<=8?rand(100,9999):rand(1000,999999); const s=String(n); const i=rand(0,s.length-1); const val=Number(s[i])*10**(s.length-1-i); const names=["ones","tens","hundreds","thousands","ten thousands","hundred thousands"]; return {q:`In ${n.toLocaleString()}, what is the value of the digit ${s[i]}?`, ...trio(val,[Number(s[i]), Number(s[i])*10, val*10]), explanation:`That ${s[i]} sits ${s.length-1-i} place(s) left of the ones place, so its value is ${s[i]} × ${10**(s.length-1-i)} = ${val}.`}},
    expanded(){const h=rand(1,9), t=rand(0,9), o=rand(0,9); const n=100*h+10*t+o; return {q:`What is ${n} in expanded form?`, ...trio(`${100*h} + ${10*t} + ${o}`,[`${h} + ${t} + ${o}`, `${h}+${t}+${o}+${n}`]), explanation:`${n} = ${h} hundreds + ${t} tens + ${o} ones = ${100*h} + ${10*t} + ${o}.`}},
    compare(){const a=rand(20,900), b=a+pick([-80,-20,-5,5,20,80]); return {q:`Which symbol belongs in ${a} __ ${b}?`, ...trio(a>b?">":a<b?"<":"=",[a>b?"<":">","≥"]), explanation:`${a} is ${a>b?"greater":a<b?"less":"equal"} than ${b}, so the correct symbol is ${a>b?">":a<b?"<":"="}.`}},
    order_nums(){const a=rand(10,40),b=a+rand(3,20),c=b+rand(3,20); return {q:`Which list is in order from least to greatest?`, ...trio(`${a}, ${b}, ${c}`,[`${c}, ${b}, ${a}`,`${b}, ${a}, ${c}`]), explanation:`${a} < ${b} < ${c}, so least to greatest is ${a}, ${b}, ${c}.`}},
    round(){const n=rand(24,980); const place=age<=8?pick([10,100]):pick([10,100,1000]); const ans=Math.round(n/place)*place; return {q:`Round ${n} to the nearest ${place}.`, ...trio(ans,[Math.floor(n/place)*place, Math.ceil(n/place)*place, n]), explanation:`Look at the digit one place to the right of the ${place}s place. Then ${n} rounds to ${ans}.`}},
    add(){const a=rand(age<=8?20:100, age<=8?400:800), b=rand(11, age<=8?300:500); return {q:`What is ${a} + ${b}?`, ...trio(a+b,[a+b+10,a+b-10,a+b+100]), explanation:`${a} + ${b} = ${a+b}. Add place by place and regroup if a column reaches 10.`}},
    sub(){const a=rand(50,900), b=rand(10,a-5); return {q:`What is ${a} − ${b}?`, ...trio(a-b,[a+b,a-b+10,b-a]), explanation:`${a} − ${b} = ${a-b}. Subtract place by place, borrowing if needed.`}},
    mul_small(){const a=rand(2,10),b=rand(2,10); return {q:`What is ${a} × ${b}?`, ...trio(a*b,[a+b,a*b+a,a*(b-1)]), explanation:`${a} groups of ${b} equal ${a*b}.`}},
    mul_2d(){const a=rand(12,28),b=rand(3,12); return {q:`Compute ${a} × ${b}.`, ...trio(a*b,[(a-1)*b,a*(b+1),a+b]), explanation:`${a}×${b} = (${Math.floor(a/10)*10}×${b}) + (${a%10}×${b}) = ${Math.floor(a/10)*10*b} + ${(a%10)*b} = ${a*b}.`}},
    mul_3d(){const a=rand(102,240),b=rand(3,8); return {q:`Compute ${a} × ${b}.`, ...trio(a*b,[a+b,a*b+10,a*(b-1)]), explanation:`Multiply ${a} by ${b} place by place to get ${a*b}.`}},
    div_exact(){const b=rand(3,9),q=rand(4,12),a=b*q; return {q:`What is ${a} ÷ ${b}?`, ...trio(q,[b,q+1,a-b]), explanation:`${b} × ${q} = ${a}, so ${a} ÷ ${b} = ${q}.`}},
    div_rem(){const d=rand(3,9),q=rand(3,11),r=rand(1,d-1),n=d*q+r; return {q:`What is ${n} ÷ ${d} as quotient and remainder?`, ...trio(`${q} R ${r}`,[`${q} R 0`,`${q+1} R ${r}`,`${q} R ${d}`]), explanation:`${d}×${q}=${d*q} and ${n}-${d*q}=${r}, so ${q} R ${r}. The remainder must be less than ${d}.`}},
    unit_frac(){const d=pick([2,3,4,5,6,8]); return {q:`A whole is split into ${d} equal parts. What is one part?`, ...trio(`1/${d}`,[`1/${d+1}`,`${d}/1`,`1/${d-1||2}`]), explanation:`One equal part out of ${d} is the unit fraction 1/${d}.`}},
    frac_whole(){const d=pick([4,5,6,8]),n=rand(1,d-1); return {q:`What fraction of a whole is ${n} parts if the whole has ${d} equal parts?`, ...trio(`${n}/${d}`,[`${d}/${n}`,`1/${n}`,`${n}/${n}`]), explanation:`Numerator counts parts you have (${n}); denominator counts parts in the whole (${d}).`}},
    compare_frac(){const d=pick([5,6,8,10]),a=rand(1,d-2),b=rand(a+1,d-1); return {q:`Which is larger, ${a}/${d} or ${b}/${d}?`, ...trio(`${b}/${d}`,[`${a}/${d}`,"They are equal"]), explanation:`Same denominator, so the larger numerator wins: ${b}/${d} > ${a}/${d}.`}},
    eq_frac(){const n=rand(1,5),d=n+rand(1,6),k=rand(2,5); return {q:`Which fraction is equivalent to ${n}/${d}?`, ...trio(`${n*k}/${d*k}`,[`${n+k}/${d+k}`,`${n*k}/${d}`,`${n}/${d*k}`]), explanation:`Multiply top and bottom by ${k}: ${n}/${d} = ${n*k}/${d*k}.`}},
    add_frac(){const d=pick([6,8,10,12]),a=rand(1,d/2),b=rand(1,d-a); return {q:`What is ${a}/${d} + ${b}/${d}?`, ...trio(simp(a+b,d),[`${a+b}/${d+d}`,simp(Math.abs(a-b),d)]), explanation:`Like denominators: add numerators ${a}+${b}=${a+b} and keep ${d}, then simplify if possible to ${simp(a+b,d)}.`}},
    sub_frac(){const d=pick([6,8,10,12]),a=rand(3,d-1),b=rand(1,a-1); return {q:`What is ${a}/${d} − ${b}/${d}?`, ...trio(simp(a-b,d),[simp(a+b,d),`${a-b}/${d*2}`]), explanation:`Subtract numerators and keep ${d}: ${a-b}/${d} = ${simp(a-b,d)}.`}},
    mul_frac(){const a=rand(1,4),b=pick([2,3,4,5]),c=rand(1,4),d=pick([2,3,4,5]); return {q:`What is ${a}/${b} × ${c}/${d}?`, ...trio(simp(a*c,b*d),[simp(a*c,b),simp(a+c,b+d)]), explanation:`Multiply across: (${a}×${c})/(${b}×${d}) = ${a*c}/${b*d} = ${simp(a*c,b*d)}.`}},
    div_frac(){const a=rand(1,5),b=pick([2,3,4]),c=1,d=pick([2,3,4]); return {q:`What is ${a} ÷ ${c}/${d}?`, ...trio(simp(a*d,c),[simp(a,d),String(a+d)]), explanation:`Dividing by ${c}/${d} is multiplying by ${d}/${c}. ${a} × ${d}/${c} = ${simp(a*d,c)}.`}},
    mixed_num(){const w=rand(1,4),n=rand(1,3),d=n+rand(1,4); return {q:`Write ${w} ${n}/${d} as an improper fraction.`, ...trio(`${w*d+n}/${d}`,[`${w+n}/${d}`,`${w*n}/${d}`]), explanation:`${w} ${n}/${d} = (${w}×${d} + ${n})/${d} = ${w*d+n}/${d}.`}},
    dec_place(){const t=rand(1,9); return {q:`What is the value of the digit ${t} in 3.${t}2?`, ...trio(`${t}/10`,[`${t}/100`,String(t),`${t}/1000`]), explanation:`That digit is in the tenths place, so its value is ${t} tenths = ${t}/10.`}},
    dec_add(){const a=rand(15,80)/10,b=rand(20,95)/100,s=Math.round((a+b)*100)/100; return {q:`What is ${a.toFixed(1)} + ${b.toFixed(2)}?`, ...trio(s.toFixed(2),[(s+0.1).toFixed(2),(a+b*10).toFixed(2)]), explanation:`Line up the decimals: ${a.toFixed(1)} + ${b.toFixed(2)} = ${s.toFixed(2)}.`}},
    dec_sub(){const a=rand(40,90)/10,b=rand(10,35)/10,s=Math.round((a-b)*10)/10; return {q:`What is ${a.toFixed(1)} − ${b.toFixed(1)}?`, ...trio(s.toFixed(1),[(a+b).toFixed(1),(s+1).toFixed(1)]), explanation:`${a.toFixed(1)} − ${b.toFixed(1)} = ${s.toFixed(1)}.`}},
    dec_mul(){const a=rand(2,9)/10,b=rand(2,8); const p=Math.round(a*b*10)/10; return {q:`What is ${a} × ${b}?`, ...trio(String(p),[String(a+b),String(Math.round(a*b*100)/100+1)]), explanation:`${a}×${b}=${p}. Count decimal places in the factors, then place the point in the product.`}},
    percent(){const n=pick([10,20,25,40,50,75]); return {q:`${n}% is equal to which fraction?`, ...trio(simp(n,100),[`${n}/10`,`1/${n}`]), explanation:`Percent means per 100, so ${n}% = ${n}/100 = ${simp(n,100)}.`}},
    pct_of(){const p=pick([10,20,25,50]), n=pick([20,40,60,80,120]); return {q:`What is ${p}% of ${n}?`, ...trio(n*p/100,[n*p,n+p,n-p]), explanation:`${p}% = ${p/100}. ${p/100} × ${n} = ${n*p/100}.`}},
    pct_change(){const a=pick([50,80,100,200]), p=pick([10,20,25]); return {q:`Increase ${a} by ${p}%. What is the new amount?`, ...trio(a*(100+p)/100,[a*p/100,a-a*p/100,a+p]), explanation:`New = ${a} × (1 + ${p/100}) = ${a} × ${(1+p/100).toFixed(2)} = ${a*(100+p)/100}.`}},
    area_rect(){const l=rand(4,14),w=rand(3,10); return {q:`A rectangle is ${l} by ${w}. What is its area?`, ...trio(`${l*w} square units`,[`${2*(l+w)} square units`,`${l+w} square units`]), explanation:`Area = length × width = ${l}×${w}=${l*w} square units.`}},
    area_tri(){const b=rand(6,16),h=rand(4,12); return {q:`A triangle has base ${b} and height ${h}. What is its area?`, ...trio(b*h/2,[b*h,b+h]), explanation:`A = (1/2)bh = (1/2)×${b}×${h} = ${b*h/2}.`}},
    area_circle(){const r=rand(2,8); return {q:`Using π ≈ 3.14, what is the area of a circle with radius ${r}?`, ...trio((Math.round(3.14*r*r*100)/100).toFixed(2),[(Math.round(2*3.14*r*100)/100).toFixed(2),String(r*r)]), explanation:`A=πr² ≈ 3.14×${r}² = 3.14×${r*r} = ${(Math.round(3.14*r*r*100)/100).toFixed(2)}.`}},
    peri(){const l=rand(5,12),w=rand(3,9); return {q:`A rectangle is ${l} by ${w}. What is its perimeter?`, ...trio(2*(l+w),[l*w,l+w,2*l+w]), explanation:`P=2l+2w=2(${l}+${w})=2(${l+w})=${2*(l+w)}.`}},
    volume(){const l=rand(3,8),w=rand(2,6),h=rand(2,5); return {q:`A rectangular prism is ${l} by ${w} by ${h}. What is its volume?`, ...trio(l*w*h,[l*w,2*(l*w+w*h+h*l)]), explanation:`V=lwh=${l}×${w}×${h}=${l*w*h}.`}},
    volume_cyl(){const r=rand(2,5),h=rand(3,10); return {q:`Using π ≈ 3.14, volume of a cylinder with r=${r} and h=${h}?`, ...trio((Math.round(3.14*r*r*h*100)/100).toFixed(2),[String(3.14*2*r*h),String(r*r*h)]), explanation:`V=πr²h ≈ 3.14×${r*r}×${h} = ${(Math.round(3.14*r*r*h*100)/100).toFixed(2)}.`}},
    volume_cone(){const r=3,h=pick([3,6,9]); return {q:`Using π ≈ 3.14, volume of a cone with r=${r} and h=${h}?`, ...trio((Math.round((1/3)*3.14*r*r*h*100)/100).toFixed(2),[String(Math.round(3.14*r*r*h)),String(r*h)]), explanation:`V=(1/3)πr²h ≈ (1/3)×3.14×${r*r}×${h} = ${(Math.round((1/3)*3.14*r*r*h*100)/100).toFixed(2)}.`}},
    volume_sphere(){const r=pick([3,6]); return {q:`Using π ≈ 3.14, volume of a sphere with r=${r}?`, ...trio((Math.round((4/3)*3.14*r*r*r*100)/100).toFixed(2),[String(4*3.14*r*r),String(r*r*r)]), explanation:`V=(4/3)πr³ ≈ (4/3)×3.14×${r**3} = ${(Math.round((4/3)*3.14*r**3*100)/100).toFixed(2)}.`}},
    surface(){const l=rand(3,6),w=rand(2,5),h=rand(2,4); const sa=2*(l*w+w*h+h*l); return {q:`Surface area of a ${l}×${w}×${h} rectangular prism?`, ...trio(sa,[l*w*h,l*w]), explanation:`SA=2(lw+wh+hl)=2(${l*w}+${w*h}+${h*l})=${sa}.`}},
    order_ops(){const a=rand(2,7),b=rand(3,8),c=rand(2,6); return {q:`Evaluate ${a} + ${b} × ${c}.`, ...trio(a+b*c,[(a+b)*c,a*b+c]), explanation:`Multiply first: ${b}×${c}=${b*c}, then ${a}+${b*c}=${a+b*c}.`}},
    evaluate(){const m=rand(2,6),x=rand(2,8),b=rand(1,9); return {q:`Evaluate ${m}x + ${b} when x=${x}.`, ...trio(m*x+b,[m+x+b,m*x-b]), explanation:`${m}(${x})+${b}=${m*x}+${b}=${m*x+b}.`}},
    combine(){const a=rand(2,8),b=rand(2,8); return {q:`Simplify ${a}x + ${b}x.`, ...trio(`${a+b}x`,[`${a+b}x²`,`${a*b}x`]), explanation:`Like terms: (${a}+${b})x = ${a+b}x.`}},
    distributive(){const a=rand(2,7),b=rand(2,8),c=rand(2,8); return {q:`Expand ${a}(${b}x + ${c}).`, ...trio(`${a*b}x + ${a*c}`,[`${a+b}x + ${c}`,`${a*b}x + ${c}`]), explanation:`Distribute: ${a}·${b}x + ${a}·${c} = ${a*b}x + ${a*c}.`}},
    expand(){const a=rand(1,5),b=rand(1,5); return {q:`Expand (x + ${a})(x + ${b}).`, ...trio(`x² + ${a+b}x + ${a*b}`,[`x² + ${a*b}x + ${a+b}`,`x² + ${a+b}x + ${a+b}`]), explanation:`FOIL: x² + ${b}x + ${a}x + ${a*b} = x² + ${a+b}x + ${a*b}.`}},
    one_step(){const x=rand(3,14),k=rand(4,12); const kind=rand(0,2); if(kind===0) return {q:`Solve x + ${k} = ${x+k}.`, ...trio(x,[x+k,k]), explanation:`Subtract ${k} from both sides: x=${x}.`}; if(kind===1) return {q:`Solve ${k}x = ${k*x}.`, ...trio(x,[k,k*x]), explanation:`Divide both sides by ${k}: x=${x}.`}; return {q:`Solve x − ${k} = ${x-k}.`, ...trio(x,[x-k,k]), explanation:`Add ${k} to both sides: x=${x}.`}},
    two_step(){const x=rand(2,10),m=rand(2,6),b=rand(2,12); return {q:`Solve ${m}x + ${b} = ${m*x+b}.`, ...trio(x,[x+b,m,m*x]), explanation:`Subtract ${b} to get ${m}x=${m*x}. Divide by ${m}: x=${x}.`}},
    ineq(){const x=rand(2,8),k=rand(3,10); return {q:`Solve x + ${k} > ${x+k+2}. Which is the solution?`, ...trio(`x > ${x+2}`,[`x < ${x+2}`,`x = ${x+2}`]), explanation:`Subtract ${k}: x > ${x+k+2}-${k} = ${x+2}.`}},
    integers(){const a=rand(2,12),b=rand(2,12); const kind=rand(0,2); if(kind===0) return {q:`What is ${a} + (${-b})?`, ...trio(a-b,[a+b,-(a+b)]), explanation:`Adding a negative is subtracting: ${a}−${b}=${a-b}.`}; if(kind===1) return {q:`What is ${a} − (${-b})?`, ...trio(a+b,[a-b,-(a-b)]), explanation:`Subtracting a negative is adding: ${a}+${b}=${a+b}.`}; return {q:`What is (${-a}) × (${-b})?`, ...trio(a*b,[-(a*b),a-b]), explanation:`A negative times a negative is positive: ${a*b}.`}},
    absval(){const a=rand(3,12); return {q:`What is |${-a}|?`, ...trio(a,[-a,0,1]), explanation:`Absolute value is distance from 0, so |${-a}|=${a}.`}},
    ratio(){const a=rand(2,6),b=rand(3,9),k=rand(2,5); return {q:`Which ratio is equivalent to ${a}:${b}?`, ...trio(`${a*k}:${b*k}`,[`${a+k}:${b+k}`,`${a*k}:${b}`]), explanation:`Multiply both parts by ${k} to get ${a*k}:${b*k}.`}},
    unit_rate(){const p=rand(2,6),c=p*rand(3,8); return {q:`A pack of ${p} costs $${c}. What is the unit price?`, ...trio(`$${c/p}`,[`$${c+p}`,`$${p}`]), explanation:`Unit price = ${c} ÷ ${p} = ${c/p} dollars each.`}},
    prop(){const a=rand(2,8),b=rand(3,9),k=rand(2,6); return {q:`Solve ${a}/${b} = x/${b*k}. What is x?`, ...trio(a*k,[a+b,b*k,a*b]), explanation:`Cross-multiply: ${a}·${b*k}=${b}·x → x=${a*k}. The second ratio is scaled by ${k}.`}},
    slope(){const x1=rand(-4,3),y1=rand(-3,4),dx=rand(1,5),dy=pick([-6,-4,-3,-2,-1,1,2,3,4,6]); const x2=x1+dx,y2=y1+dy; const g=gcd(dy,dx); const ans=Number.isInteger(dy/dx)?String(dy/dx):`${dy/g}/${dx/g}`; return {q:`Slope through (${x1}, ${y1}) and (${x2}, ${y2})?`, ...trio(ans,[String(dx), `${-dy}/${dx}`]), explanation:`m=(${y2}−${y1})/(${x2}−${x1})=${dy}/${dx}${ans!==`${dy}/${dx}`?" = "+ans:""}.`}},
    line(){const m=rand(-4,5)||2,b=rand(-5,7),x=rand(-3,4); return {q:`For y=${m}x + ${b}, what is y when x=${x}?`, ...trio(m*x+b,[m+b,m*x,x+b]), explanation:`y=${m}(${x})+${b}=${m*x+b}.`}},
    system(){const x=rand(2,8),y=rand(1,7); return {q:`Solve y=${y} and x+y=${x+y}. What is (x,y)?`, ...trio(`(${x}, ${y})`,[`(${y}, ${x})`,`(${x+y}, ${y})`]), explanation:`y=${y}, so x+${y}=${x+y} → x=${x}. Solution (${x}, ${y}).`}},
    pyth(){const trips=[[3,4,5],[5,12,13],[6,8,10],[9,12,15],[8,15,17]]; const [a,b,c]=pick(trips); return rand(0,1)?{q:`Right triangle legs ${a} and ${b}. Hypotenuse?`, ...trio(c,[a+b,c-1]), explanation:`c=√(${a}²+${b}²)=√(${a*a}+${b*b})=√${a*a+b*b}=${c}.`}:{q:`Right triangle hypotenuse ${c} and leg ${a}. Other leg?`, ...trio(b,[c-a,c]), explanation:`b=√(${c}²−${a}²)=√(${c*c}−${a*a})=${b}.`}},
    distance(){const x1=rand(-3,3),y1=rand(-3,3),dx=pick([3,4,5,6,8]),dy=0; return {q:`Distance from (${x1}, ${y1}) to (${x1+dx}, ${y1})?`, ...trio(dx,[dx+y1,Math.abs(x1)]), explanation:`The y-coordinates match, so distance is |${x1+dx}−${x1}|=${dx}.`}},
    midpoint(){const x1=rand(-6,6),y1=rand(-6,6),x2=x1+pick([2,4,6,8]),y2=y1+pick([2,4,6]); return {q:`Midpoint of (${x1}, ${y1}) and (${x2}, ${y2})?`, ...trio(`(${(x1+x2)/2}, ${(y1+y2)/2})`,[`(${x1}, ${y1})`,`(${x2-x1}, ${y2-y1})`]), explanation:`Average the coordinates: ((${x1}+${x2})/2, (${y1}+${y2})/2) = (${(x1+x2)/2}, ${(y1+y2)/2}).`}},
    exp_rules(){const a=rand(2,5),m=rand(2,4),n=rand(2,3); return rand(0,1)?{q:`Simplify ${a}^${m} · ${a}^${n}.`, ...trio(`${a}^${m+n}`,[`${a}^${m*n}`,`${a*2}^${m+n}`]), explanation:`Same base: add exponents → ${a}^${m+n}.`}:{q:`Simplify (${a}^${m})^${n}.`, ...trio(`${a}^${m*n}`,[`${a}^${m+n}`,`${a*n}^${m}`]), explanation:`Power of a power: multiply exponents → ${a}^${m*n}.`}},
    sci(){const lead=rand(11,89), exp=rand(2,5), n=lead*10**(exp-1); const a=(n/10**exp); return {q:`Write ${n.toLocaleString()} in scientific notation.`, ...trio(`${a} × 10^${exp}`,[`${a} × 10^${exp-1}`,`${lead} × 10^${exp}`]), explanation:`Move the decimal ${exp} places so the first factor is between 1 and 10.`}},
    factor(){const p=rand(1,6),q=rand(1,6); return {q:`Factor x² + ${p+q}x + ${p*q}.`, ...trio(`(x+${p})(x+${q})`,[`(x+${p+q})(x+${p*q})`,`(x-${p})(x-${q})`]), explanation:`Need numbers that multiply to ${p*q} and add to ${p+q}: ${p} and ${q}.`}},
    quad_eval(){const b=rand(-4,4)||-2,c=rand(-3,5),x=rand(-3,4); const val=x*x+b*x+c; const bs=b<0?`− ${-b}x`:`+ ${b}x`; const cs=c<0?`− ${-c}`:`+ ${c}`; return {q:`If f(x)=x² ${bs} ${cs}, what is f(${x})?`, ...trio(val,[x*x+c,val+1]), explanation:`(${x})² + (${b})(${x}) + (${c}) = ${x*x} + ${b*x} + ${c} = ${val}.`}},
    qformula(){return pick([
      {q:"Solutions of x² − 5x + 6 = 0?", ...trio("2 and 3",["1 and 6","−2 and −3"]), explanation:"(x−2)(x−3)=0, so x=2 or x=3."},
      {q:"Discriminant of x² + 3x + 2 = 0?", ...trio("1",["0","17"]), explanation:"b²−4ac=9−8=1."},
      {q:"How many distinct real solutions does x²−4x+4=0 have?", ...trio("1",["0","2"]), explanation:"Discriminant 16−16=0, so one real (repeated) root."}
    ])},
    similar(){const s=rand(3,8),k=rand(2,4),o=s+rand(1,5); return {q:`Similar triangles have corresponding sides ${s} and ${s*k}. If another small side is ${o}, what is the matching large side?`, ...trio(o*k,[o+k,s*o]), explanation:`Scale factor = ${k}. Matching side = ${o}×${k}=${o*k}.`}},
    angles(){const a=rand(20,70); return {q:`Two supplementary angles, one measures ${a}°. What is the other?`, ...trio(180-a,[90-a,180+a,a]), explanation:`Supplementary angles sum to 180°, so the other is 180−${a}=${180-a}°.`}},
    triangle_sum(){const a=rand(30,80),b=rand(30,80); if(a+b>=170) return G.angles(); return {q:`A triangle has angles ${a}° and ${b}°. What is the third angle?`, ...trio(180-a-b,[a+b,90]), explanation:`Angles in a triangle sum to 180°, so 180−${a}−${b}=${180-a-b}°.`}},
    trig(){return pick([
      {q:"Opposite=3, hypotenuse=6. What is sin θ?", ...trio("1/2",["2","3/6 + 1"]), explanation:"sin=opposite/hypotenuse=3/6=1/2."},
      {q:"Adjacent=4, hypotenuse=8. What is cos θ?", ...trio("1/2",["2","4"]), explanation:"cos=adjacent/hypotenuse=4/8=1/2."},
      {q:"Opposite=5, adjacent=5. What is tan θ?", ...trio("1",["0","25"]), explanation:"tan=opposite/adjacent=5/5=1."},
      {q:"Which ratio is tan θ?", ...trio("opposite / adjacent",["opposite / hypotenuse","adjacent / hypotenuse"]), explanation:"SOH-CAH-TOA: tangent is opposite over adjacent."}
    ])},
    circ(){const r=rand(2,10); return {q:`Using π ≈ 3.14, circumference of a circle with radius ${r}?`, ...trio((Math.round(2*3.14*r*100)/100).toFixed(2),[(Math.round(3.14*r*r*100)/100).toFixed(2),String(2*r)]), explanation:`C=2πr≈2×3.14×${r}=${(Math.round(2*3.14*r*100)/100).toFixed(2)}.`}},
    growth(){const a=pick([100,200,500]),r=pick([10,20]),t=2; return {q:`$${a} grows at ${r}% per year for ${t} years. New amount?`, ...trio(a*((1+r/100)**t),[a+a*r/100*t,a*(1+r/100)]), explanation:`A=a(1+r)ᵗ=${a}(1+${(r/100).toFixed(2)})^${t}=${a*((1+r/100)**t)}.`}},
    decay(){const a=pick([80,160,200]),r=pick([10,25]); return {q:`${a} decreases by ${r}%. What remains?`, ...trio(a*(100-r)/100,[a*r/100,a+a*r/100]), explanation:`Remaining = ${a}×(1−${r/100})=${a*(100-r)/100}.`}},
    func(){const m=rand(2,6),b=rand(-4,6),x=rand(-3,5); return {q:`If f(x)=${m}x ${b<0?"−":"+"} ${Math.abs(b)}, what is f(${x})?`, ...trio(m*x+b,[m+x+b,x]), explanation:`f(${x})=${m}(${x}) ${b<0?"−":"+"} ${Math.abs(b)}=${m*x+b}.`}},
    compose(){const a=rand(2,5),b=rand(1,6),x=rand(1,5); return {q:`f(x)=${a}x and g(x)=x+${b}. What is (f∘g)(${x})?`, ...trio(a*(x+b),[a*x+b,x+b+a]), explanation:`g(${x})=${x}+${b}=${x+b}. Then f(${x+b})=${a}×${x+b}=${a*(x+b)}.`}},
    log(){return pick([
      {q:"What is log₂ 16?", ...trio("4",["2","8"]), explanation:"2⁴=16, so log₂ 16=4."},
      {q:"What is log₁₀ 1000?", ...trio("3",["2","10"]), explanation:"10³=1000."},
      {q:"If log₃ x=2, what is x?", ...trio("9",["6","8"]), explanation:"3²=x, so x=9."},
      {q:"What is log₅ 1?", ...trio("0",["1","5"]), explanation:"Any valid base to the power 0 is 1."}
    ])},
    log_prop(){return pick([
      {q:"log 3 + log 5 equals which log?", ...trio("log 15",["log 8","log 2"]), explanation:"Product rule: log 3 + log 5 = log(3×5)=log 15."},
      {q:"2 log 5 equals?", ...trio("log 25",["log 10","log 7"]), explanation:"Power rule: 2 log 5 = log(5²)=log 25."}
    ])},
    exp_eq(){return pick([
      {q:"Solve 2ˣ = 32.", ...trio("5",["4","16"]), explanation:"32=2⁵, so x=5."},
      {q:"Solve 3ˣ = 9.", ...trio("2",["3","9"]), explanation:"9=3², so x=2."},
      {q:"Solve 10ˣ = 1000.", ...trio("3",["2","4"]), explanation:"1000=10³, so x=3."}
    ])},
    unit_circle(){return pick([
      {q:"What is sin 30°?", ...trio("1/2",["0","√3/2"]), explanation:"Opposite/hypotenuse in a 30-60-90 triangle is 1/2."},
      {q:"What is cos 60°?", ...trio("1/2",["√3/2","1"]), explanation:"cos 60°=1/2."},
      {q:"What is tan 45°?", ...trio("1",["0","√2/2"]), explanation:"Opposite=adjacent in a 45-45-90 triangle."},
      {q:"What is sin 90°?", ...trio("1",["0","1/2"]), explanation:"On the unit circle, 90° is (0,1); sine is the y-coordinate."}
    ])},
    degrees_rad(){return pick([
      {q:"Convert 180° to radians.", ...trio("π",["2π","π/2"]), explanation:"180°=π radians."},
      {q:"Convert π/2 radians to degrees.", ...trio("90°",["45°","180°"]), explanation:"π radians=180°, so π/2=90°."},
      {q:"Convert 360° to radians.", ...trio("2π",["π","π/2"]), explanation:"A full turn is 2π radians."}
    ])},
    arith_seq(){const a=rand(2,10),d=rand(2,6),n=rand(4,8); return {q:`Arithmetic sequence: first term ${a}, common difference ${d}. What is term ${n}?`, ...trio(a+(n-1)*d,[a+n*d,a+d]), explanation:`aₙ=a₁+(n−1)d=${a}+(${n}−1)${d}=${a+(n-1)*d}.`}},
    geo_seq(){const a=pick([2,3]),r=pick([2,3]),n=pick([4,5]); return {q:`Geometric sequence: first term ${a}, ratio ${r}. What is term ${n}?`, ...trio(a*r**(n-1),[a*r*n,a+r*(n-1)]), explanation:`aₙ=a₁·rⁿ⁻¹=${a}·${r}^${n-1}=${a*r**(n-1)}.`}},
    series_sum(){const a=rand(2,5),d=rand(2,5),n=rand(4,6); const last=a+(n-1)*d; const s=n/2*(a+last); return {q:`Sum of ${n} terms of an arithmetic series with first term ${a} and last term ${last}?`, ...trio(s,[n*(a+last),a+last]), explanation:`Sₙ=n/2·(first+last)=${n}/2·(${a}+${last})=${s}.`}},
    limit(){const m=rand(2,6),b=rand(-4,8),c=rand(-3,5); return {q:`What is lim x→${c} (${m}x + ${b})?`, ...trio(m*c+b,[m+c+b,c]), explanation:`A polynomial is continuous, so the limit equals the function value: ${m}(${c})+${b}=${m*c+b}.`}},
    mean(){const a=rand(2,10),b=rand(2,10),c=rand(2,10); const sum=a+b+c; return {q:`Mean of ${a}, ${b}, and ${c}?`, ...trio(Number.isInteger(sum/3)?String(sum/3):(Math.round(sum/3*100)/100).toString(),[String(sum),String(Math.max(a,b,c))]), explanation:`Mean=(${a}+${b}+${c})/3=${sum}/3=${Number.isInteger(sum/3)?sum/3:(sum+"/3")}.`}},
    median(){const arr=shuffle([rand(1,5),rand(6,10),rand(11,16)]); const sorted=[...arr].sort((x,y)=>x-y); return {q:`Median of ${arr.join(", ")}?`, ...trio(sorted[1],[sorted[0],sorted[2]]), explanation:`Sorted: ${sorted.join(", ")}. The middle value is ${sorted[1]}.`}},
    mode(){const a=rand(2,8),b=a+rand(1,5); return {q:`Mode of ${a}, ${b}, ${a}, ${b+1}?`, ...trio(a,[b,b+1]), explanation:`${a} appears most often, so the mode is ${a}.`}},
    range(){const a=rand(2,8),b=a+rand(6,15); return {q:`Range of ${a}, ${a+2}, ${b}?`, ...trio(b-a,[b,a+2]), explanation:`Range=max−min=${b}−${a}=${b-a}.`}},
    prob(){const t=pick([6,8,10]),f=rand(1,t-1); return {q:`A spinner has ${t} equal sections, ${f} red. P(red)?`, ...trio(`${f}/${t}`,[`${t}/${f}`,`1/${f}`]), explanation:`P=favorable/total=${f}/${t}.`}},
    coord(){const x=rand(-4,4)||2,y=rand(-4,4)||-3; return {q:`A point is ${x} units right/left and ${y} units up/down from the origin. What are its coordinates?`, ...trio(`(${x}, ${y})`,[`(${y}, ${x})`,`(${-x}, ${y})`]), explanation:`x describes horizontal move, y describes vertical move, so the point is (${x}, ${y}).`}},
    gcf(){const g=pick([2,3,4,5,6]),a=g*rand(2,5),b=g*rand(2,5); return {q:`What is a common factor of ${a} and ${b}?`, ...trio(String(g),[String(a+b),String(Math.max(a,b))]), explanation:`${g} divides both ${a} and ${b}. (The GCF may be ${g} or a multiple of ${g} that still divides both.)`}},
    lcm(){const a=pick([3,4,5,6]),b=pick([4,5,6,8]); const l=a*b/gcd(a,b); return {q:`What is the LCM of ${a} and ${b}?`, ...trio(l,[a*b,gcd(a,b),a+b]), explanation:`LCM is the smallest shared multiple, which is ${l}.`}},
    pattern(){const a=rand(2,8),d=rand(2,6); return {q:`The pattern is ${a}, ${a+d}, ${a+2*d}, … What is the next term?`, ...trio(a+3*d,[a+d,a+2*d+1]), explanation:`The rule is add ${d}. Next is ${a+2*d}+${d}=${a+3*d}.`}},
    inout(){const k=rand(2,6),x=rand(3,10); return {q:`The rule is multiply by ${k}, then add 1. What is the output for ${x}?`, ...trio(k*x+1,[k*x,x+1+k]), explanation:`${x}×${k}+1=${k*x+1}.`}},
    elapsed(){const h=rand(1,10), add=pick([15,30,45,60,90]); const startM=pick([0,15,30]); const tot=h*60+startM+add; const eh=Math.floor(tot/60)%12 || 12; const em=tot%60; const sm=String(startM).padStart(2,"0"); const ems=String(em).padStart(2,"0"); return {q:`A clock shows ${h}:${sm}. What time is it after ${add} minutes?`, ...trio(`${eh}:${ems}`,[`${h}:${ems}`,`${eh}:${sm}`]), explanation:`${add} minutes after ${h}:${sm} is ${eh}:${ems}.`}},
    money(){const q=rand(1,4),d=rand(1,4); const cents=25*q+10*d; return {q:`${q} quarter(s) and ${d} dime(s) total how many cents?`, ...trio(cents,[25*q+d,10*q+25*d]), explanation:`${q}×25 + ${d}×10 = ${25*q}+${10*d}=${cents} cents.`} }
  };
  const fn=G[type]||G.add;
  let p;
  try{p=fn()}catch(e){p=G.add()}
  if(!p||!p.choices||p.answer<0) p=G.add();
  return p;
}

let currentAge=8, currentQ="all", query="";
let state=null;
const home=document.getElementById("home");
const lesson=document.getElementById("lesson");
const backBtn=document.getElementById("backBtn");
const weekGrid=document.getElementById("weekGrid");

function renderFilters(){
  const ages=[8,9,10,11,12,13,14,15,16];
  document.getElementById("ageBar").innerHTML=ages.map(a=>`<button class="${currentAge===a?"on":""}" data-age="${a}">Age ${a}</button>`).join("");
  document.getElementById("ageBar").querySelectorAll("button").forEach(b=>b.onclick=()=>{currentAge=Number(b.dataset.age);renderAll()});
  document.getElementById("qBar").innerHTML=["all",1,2,3,4].map(q=>`<button class="${currentQ==q?"on":""}" data-q="${q}">${q==="all"?"All 52 weeks":"Q"+q+" · Weeks "+((q-1)*13+1)+"–"+q*13}</button>`).join("");
  document.getElementById("qBar").querySelectorAll("button").forEach(b=>b.onclick=()=>{currentQ=b.dataset.q==="all"?"all":Number(b.dataset.q);renderWeeks()});
}

function visibleWeeks(){
  return WEEKS.filter(w=>w.age===currentAge && (currentQ==="all"||w.quarter===currentQ) && (!query|| (w.title+" "+w.unit+" "+w.concept).toLowerCase().includes(query)));
}

function renderWeeks(){
  const list=visibleWeeks();
  const grade=RAW[currentAge].grade;
  document.getElementById("count").textContent=`Age ${currentAge} · ${grade} · showing ${list.length} of 52 weeks`;
  weekGrid.innerHTML=list.map(w=>`
    <button class="card" data-id="${w.id}">
      <div class="tag">Week ${w.week} · ${w.unit}</div>
      <h3>${w.title}</h3>
      <p>5 problems · ${grade}</p>
    </button>`).join("");
  weekGrid.querySelectorAll(".card").forEach(card=>card.onclick=()=>openWeek(card.dataset.id));
}

function renderAll(){renderFilters();renderWeeks()}

function openWeek(id){
  const week=WEEKS.find(w=>w.id===id);
  const problems=Array.from({length:5},()=>makeProblem(week.type, week.age));
  state={week,problems,i:0,picked:Array(5).fill(null)};
  home.classList.add("hidden"); lesson.classList.remove("hidden"); backBtn.classList.remove("hidden");
  renderLesson();
}

function renderLesson(){
  const {week,problems,i,picked}=state;
  const finished=picked.every(v=>v!==null) && i===problems.length-1 && picked[i]!==null && state.showDone;
  if(state.showDone){
    const score=picked.reduce((s,sel,idx)=>s+(sel===problems[idx].answer?1:0),0);
    lesson.innerHTML=`<div class="concept done"><h2>Week ${week.week} complete</h2><p>You answered ${score} of 5 correctly.</p><p>${week.title} · Age ${week.age}</p><p style="margin-top:16px"><button class="primary" id="again">Practice this week again</button></p></div>`;
    document.getElementById("again").onclick=()=>openWeek(week.id);
    return;
  }
  const p=problems[i];
  const sel=picked[i];
  const pct=((i+(sel!=null?1:0))/5)*100;
  lesson.innerHTML=`
    <div class="concept">
      <div class="meta">Age ${week.age} · ${week.grade} · Week ${week.week} of 52 · ${week.unit}</div>
      <h2>${week.title}</h2>
      <p>${week.concept}</p>
    </div>
    <div class="problem">
      <div class="meta">Problem ${i+1} of 5</div>
      <div class="progress"><span style="width:${pct}%"></span></div>
      <div class="q">${p.q}</div>
      <div class="choices">
        ${p.choices.map((c,idx)=>{
          let cls="choice";
          if(sel!=null){ if(idx===p.answer) cls+=" correct"; else if(idx===sel) cls+=" wrong"; }
          return `<button class="${cls}" data-idx="${idx}" ${sel!=null?"disabled":""}>${c}</button>`;
        }).join("")}
      </div>
      ${sel!=null?`<div class="feedback ${sel===p.answer?"ok":"no"}"><strong>${sel===p.answer?"Correct.":"Not quite."}</strong> ${p.explanation}</div>`:""}
      <div class="nav-row">
        <button class="ghost" id="prevP" ${i===0?"disabled":""}>Previous</button>
        <button class="primary" id="nextP" ${sel==null?"disabled":""}>${i===4?"Finish week":"Next problem"}</button>
      </div>
    </div>`;
  lesson.querySelectorAll(".choice").forEach(btn=>btn.onclick=()=>{state.picked[i]=Number(btn.dataset.idx);renderLesson()});
  document.getElementById("prevP").onclick=()=>{state.i=Math.max(0,i-1);renderLesson()};
  document.getElementById("nextP").onclick=()=>{
    if(i===4){state.showDone=true;renderLesson()}
    else {state.i=i+1;renderLesson()}
  };
}

backBtn.onclick=()=>{lesson.classList.add("hidden");home.classList.remove("hidden");backBtn.classList.add("hidden");state=null};
document.getElementById("search").oninput=e=>{query=e.target.value.trim().toLowerCase();renderWeeks()};
renderAll();
</script>
